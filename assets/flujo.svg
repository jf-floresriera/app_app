<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Flujo del intento: ingreso, inicio, evaluación, y si hay infracción el intento se reinicia hasta anularse o enviarse">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1b6b35"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b3261e"/>
    </marker>
  </defs>
  <rect width="1200" height="250" rx="14" fill="#f3f6ec"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#1b6b35" stroke-width="2">
      <rect x="30" y="40" width="190" height="70" rx="12"/>
      <rect x="290" y="40" width="190" height="70" rx="12"/>
      <rect x="550" y="40" width="190" height="70" rx="12" fill="#eef7e0"/>
      <rect x="810" y="40" width="190" height="70" rx="12"/>
    </g>
    <rect x="1050" y="40" width="130" height="70" rx="12" fill="#f2c500" stroke="#c79a00" stroke-width="2"/>
    <rect x="450" y="160" width="300" height="64" rx="12" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
    <rect x="810" y="160" width="190" height="64" rx="12" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>

    <g font-size="17" font-weight="700" fill="#0e3b22">
      <text x="125" y="70">Ingreso</text>
      <text x="385" y="70">Instrucciones</text>
      <text x="645" y="70">Evaluación</text>
      <text x="905" y="70">Envío</text>
      <text x="1115" y="70">Nota</text>
      <text x="600" y="188" fill="#b3261e">Infracción detectada</text>
      <text x="905" y="188" fill="#b3261e">3 infracciones</text>
    </g>
    <g font-size="13" fill="#5a6a5c">
      <text x="125" y="92">nombre · correo · documento</text>
      <text x="385" y="92">pantalla completa</text>
      <text x="645" y="92">preguntas paramétricas</text>
      <text x="905" y="92">calificación en el servidor</text>
      <text x="1115" y="92">escala 0,0 a 5,0</text>
      <text x="600" y="209" fill="#b3261e">se reinicia con valores nuevos</text>
      <text x="905" y="209" fill="#b3261e">intento anulado (0,0)</text>
    </g>

    <g stroke="#1b6b35" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M220 75H284"/><path d="M480 75H544"/><path d="M740 75H804"/><path d="M1000 75H1044"/>
    </g>
    <g stroke="#b3261e" stroke-width="2.5" fill="none" marker-end="url(#r)">
      <path d="M645 110V154"/>
      <path d="M450 192H400Q380 192 380 172V114"/>
      <path d="M750 192H804"/>
    </g>
    <text x="520" y="150" font-size="12" fill="#b3261e" text-anchor="start">cambio de pestaña · salir de pantalla completa · copiar o pegar</text>
  </g>
</svg>
